name: Deploy to GitHub Pages

# A test site at https://virtualvinodh.github.io/aksharajanani/, rebuilt on every push to
# `claude` (the working branch) or `main`. The app will later move to its own domain, served
# from `/`; only BASE_PATH below is specific to GitHub Pages.
on:
  push:
    branches: [main, claude]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `prebuild` downloads the font builder (Pyodide + fontTools) into public/font-builder/.
      - run: npm run build
        env:
          BASE_PATH: /aksharajanani/
          FONT_BUILDER_REQUIRED: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
